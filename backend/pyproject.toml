[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "notepilot"
version = "0.1.0"
description = "Trend-informed Xiaohongshu image-note creation agent"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "pydantic>=2.9,<3", "langgraph>=1.0,<2", "playwright==1.51.0", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["notepilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
